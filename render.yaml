databases:
  - name: protox-db
    databaseName: protox
    user: protox
    plan: free

services:
  - type: web
    name: protox-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protox-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: APPROVAL_TIMEOUT_MINUTES
        value: "1"
      - key: NOTIFICATION_WEBHOOK_URL
        value: ""
      - key: CORS_ORIGIN
        value: https://protox-frontend.onrender.com

  - type: web
    name: protox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://protox-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
